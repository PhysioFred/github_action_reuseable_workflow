name: Reusable Greeting Workflow

on:
  workflow_call:
    inputs:
      person-name:
        description: 'The name of the person to greet'
        required: true
        type: string
    secrets:
      greeting-key:
        description: 'Secret key to unlock a special greeting'
        required: false

jobs:
  greet:
    runs-on: ubuntu-latest

    steps:
      - name: Print Standard Greeting
        run: echo "Hello, ${{ inputs.person-name }}! Nice to meet you!"

      - name: Check Greeting Key
        run: |
          if [ -z "${{ secrets.greeting-key }}" ]; then
            echo "No greeting key provided. Standard greeting only."
          elif [ "${{ secrets.greeting-key }}" = "supersecret123" ]; then
            echo "🎉 Special Greeting Unlocked! Welcome, ${{ inputs.person-name }}, you're a VIP!"
          else
            echo "Invalid greeting key. Standard greeting only."
          fi