name: Reusable Greeting Workflow

# This tells GitHub that this workflow can be called by other workflows
on:
  workflow_call:
    inputs:
      person-name:
        description: 'The name of the person to greet'
        required: true  # This input must be provided by the caller
        type: string    # The input is a string

jobs:
  greet:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Print the greeting message
      - name: Print Greeting
        run: echo "Hello, ${{ inputs.person-name }}! Nice to meet you!"